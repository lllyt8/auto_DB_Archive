database: epcenergy_ess_01
max_generations: 4
schedule_timezone: EST
dry_run: true
log_path: /home/epc_ai/aidetect/logs/db_archive.log
lock_path: /tmp/db_archive.lock

tables:
  - name: ess_string_HON
    max_generations: 4
  - name: ess_string_HONSJ
    max_generations: 4
  - name: ess_string_0000
    max_generations: 4
  - name: ess_string_DLN
    max_generations: 4

mysql:
  host: localhost
  port: 3306
  user: ${ARCHIVE_DB_USER}
  password: ${ARCHIVE_DB_PASSWORD}
  database: epcenergy_ess_01

email:
  enabled: true
  sender: it@epcenergy.io
  recipients:
    - it@epcenergy.io
  smtp_host: smtp.gmail.com
  smtp_port: 587
  smtp_user: ${ARCHIVE_SMTP_USER}
  smtp_password: ${ARCHIVE_SMTP_PASSWORD}
  starttls: true

timescale_check:
  enabled: false
  mode: warn
  command: ""
